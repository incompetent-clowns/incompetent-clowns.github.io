<!DOCWTYPE html>
    <html>

    <head>
        <title>Project B | User</title>
        <style>

    <body>
        <h1>Project B | User</h1>

        <button id="login">Login with Google</button>
        <br>
        <br><br>

        <input id="deviceID" placeholder="device ID" />
        <button id="connect">Connect</button>
        <button id="disconnect">Disconnect</button>
        <br><br>
        <button id="resetWebRTC">Request remote WebRTC reset</button>
        <button id="pageReload">Request remote webpage reload</button>
        <br><br>

        <textarea id="regStatus" rows="5" cols="60" placeholder="Status" readonly></textarea> <br />

        
        <button id="allowedEmailsUpdate">Update Allowed Emails</button>

        <h3>Local</h3>
        <video id="local" autoplay muted playsinline></video>

        <h3>Remote</h3>
        <video id="remote" autoplay playsinline></video>

        <h3>ESP32</h3>
        <input id="ESP32deviceID" placeholder="ESP32 device ID" /> <br /><br /><br />
        <div class="dpadContainer">
            <div class="dpad">
                <button id="up">▲</button>
                <button id="left">◀</button>
                <button id="right">▶</button>
                <button id="down">▼</button>
            </div>
        </div>
        <br />
        <br />
        <br />
        <textarea id="messageToESP32" rows="5" cols="60" placeholder="Message to ESP32"></textarea> <br />
        <button id="btnESP32">Send to ESP32</button> <br />

        <script src="https://accounts.google.com/gsi/client" async defer></script>
        <script>

            const BACKEND = "https://mac.taild17908.ts.net"; //:10000
            const WS_BACKEND = "wss://mac.taild17908.ts.net";

            statusEl = document.getElementById("regStatus");
            messageToESP32El = document.getElementById("messageToESP32");

            deviceIDEl = document.getElementById("deviceID");
            ESP32deviceIDEl = document.getElementById("ESP32deviceID");

            saveddeviceID = localStorage.getItem("deviceID");
            savedESP32deviceID = localStorage.getItem("ESP32deviceID");

            if(saveddeviceID){
                deviceIDEl.value = saveddeviceID;
            }

            if(savedESP32deviceID){
                ESP32deviceIDEl.value = savedESP32deviceID;
            }

            let socket;
            let pc;
            let localStream;
            let myEmail;

            // Google Login
            window.onload = async () => {
                google.accounts.id.initialize({
                    client_id: "485427982591-ug9t0vdn3cmu5bh3s9s63h3k6vmpfj45.apps.googleusercontent.com",
                    callback: handleGoogleLogin
                });

                document.getElementById("login").onclick = () => {
                    google.accounts.id.prompt();
                };

                await ensurePeerConnection();

            };

            async function handleGoogleLogin(response) {
                statusEl.value = statusEl.value + `Attempting authentication with Google.\nGoogle sent: ${response.credential}\n`

                const res = await fetch(`${BACKEND}/auth/google`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ idToken: response.credential })
                });
                statusEl.value = statusEl.value + `Response from the server: ${res}\n`

                const data = await res.json();

                statusEl.value = statusEl.value + `Obtained the following token\n${data.token}`;

                statusEl.value = statusEl.value + `Trying a websocket connection now.`;
                connectWebSocket(data.token);
            }

            // Websocket 
            function connectWebSocket(token) {
                statusEl.value = statusEl.value + `Websocket connection initiated, using the following token\n${token}`
                socket = new WebSocket(`${WS_BACKEND}?token=${token}`);

                socket.onmessage = async (event) => {
                    let msg = JSON.parse(event.data);

                    statusEl.value = statusEl.value + `\nReceived:\n${event.data}`;
                    // if (msg.Wtype === "offer") {
                    //     await ensurePeerConnection();
                    //     await pc.setRemoteDescription(msg.sdp);
                    //     const answer = await pc.createAnswer();
                    //     await pc.setLocalDescription(answer);
                    //     send({ Wtype: "answer", to: msg.from, sdp: answer });
                    // }

                    if (msg.type === "answer") {
                        statusEl.value = statusEl.value + `\nSetting Remote Description\n${JSON.stringify(msg.sdp)}`;
                        // await ensurePeerConnection();
                        await pc.setRemoteDescription(msg.sdp);
                        statusEl.value = statusEl.value + `\nDone\n`;
                    }

                    if (msg.type === "ice") {
                        statusEl.value = statusEl.value + `\nAdding Ice Candidate\n${JSON.stringify(msg.candidate)}`;
                        // await ensurePeerConnection();
                        await pc.addIceCandidate(msg.candidate);
                        statusEl.value = statusEl.value + `\nDone\n`;
                    }
                };
            }

            document.getElementById("btnESP32").onclick = async () => {
                const ESP32deviceID = ESP32deviceIDEl.value;
                const messageToESP32 = messageToESP32El.value;
                // const ESP32deviceIDEl
                send({ Type: "plain", to: ESP32deviceID, payload: messageToESP32 });
            }

            document.getElementById("resetWebRTC").onclick = async () => {
                const deviceID = deviceIDEl.value;
                send({ Type: "resetWebRTC", to: deviceID });
            }

            document.getElementById("pageReload").onclick = async () => {
                const deviceID = deviceIDEl.value;
                send({ Type: "pageReload", to: deviceID });
            }



            document.getElementById("disconnect").onclick = async () => {
                try {
                    document.getElementById("local").srcObject = null;
                    await pc.close();
                    pc = null;
                    log("Killed the peer connection object.");
                    if (localStream) {
                        localStream.getTracks().forEach(track => track.stop());
                        localStream = null;
                    }                    
                    log("Released the local camera.")
                    await delay(1000);

                    const deviceID = deviceIDEl.value;
                    send({ Type: "resetWebRTC", to: deviceID });
                    log("Requested the remote client to do the same.");
                }
                catch {
                    log("Not on a call.")
                }
            }

            document.getElementById("connect").onclick = async () => {
                localStorage.setItem("deviceID", deviceIDEl.value);
                localStorage.setItem("ESP32deviceID", ESP32deviceIDEl.value);
            // saveddeviceID = localStorage.getItem("deviceID");
            // savedESP32deviceID = localStorage.getItem("ESP32deviceID");

                

                const deviceID = deviceIDEl.value;
                await ensurePeerConnection();

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer)

                send({ type: "offer", to: deviceID, sdp: offer });
            }

            function send(msg) {
                socket.send(JSON.stringify(msg));
            }


            //TODO: replace currentPeer with deviceID 
            function currentPeer() {
                // return document.getElementById("deviceID").value;
                return deviceIDEl.value;
            }

            async function ensurePeerConnection() {
                if (pc) return;

                // localStream = await navigator.mediaDevices.getUserMedia({
                //     video: true,
                //     audio: true
                // });
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: true
                });

                document.getElementById("local").srcObject = localStream;

                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: "stun:stun.l.google.com:19302" }
                    ]
                });

                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

                pc.ontrack = e => {
                    document.getElementById("remote").srcObject = e.streams[0];
                };

                pc.onicecandidate = e => {
                    if (e.candidate) {
                        send({ type: "ice", to: currentPeer(), candidate: e.candidate });
                    }
                };
            }

            function log(str) {
                statusEl.value = statusEl.value + str + "\n";
            }

        </script>


        <script>
            const directions = ['up', 'down', 'left', 'right'];

            function move(dir, isPressed) {
                console.log(dir, isPressed ? 'pressed' : 'released');

                const ESP32deviceID = ESP32deviceIDEl.value;
                // const messageToESP32 = messageToESP32El.value;
                // const ESP32deviceIDEl
                send({ Type: "cmd", to: ESP32deviceID, payload: { dir, isPressed } });

                // Hook your game logic here, e.g.:
                // if (isPressed) player.startMoving(dir); else player.stopMoving(dir);

            }

            directions.forEach(dir => {
                const btn = document.getElementById(dir);

                const start = (e) => {
                    e.preventDefault(); // stops synthetic mouse events + long-press menu
                    btn.classList.add('pressed');
                    move(dir, true);
                };

                const end = (e) => {
                    e.preventDefault();
                    btn.classList.remove('pressed');
                    move(dir, false);
                };

                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end);
                btn.addEventListener('touchcancel', end);

                // Fallback for desktop/mouse testing
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
                btn.addEventListener('mouseleave', end);
            });


            // --- Keyboard bindings ---
            const keyMap = {
                ArrowUp: 'up',
                ArrowDown: 'down',
                ArrowLeft: 'left',
                ArrowRight: 'right',
                // Optional WASD support:
                // w: 'up', a: 'left', s: 'down', d: 'right',
                // W: 'up', A: 'left', S: 'down', D: 'right',
            };

            window.addEventListener('keydown', (e) => {
                const dir = keyMap[e.key];
                if (!dir) return;

                e.preventDefault(); // stop page scrolling on arrow keys

                if (e.repeat) return; // ignore OS auto-repeat, treat as one continuous press

                document.getElementById(dir).classList.add('pressed');
                move(dir, true);
            });

            window.addEventListener('keyup', (e) => {
                const dir = keyMap[e.key];
                if (!dir) return;

                document.getElementById(dir).classList.remove('pressed');
                move(dir, false);
            });


            let remoteVideoEl = document.getElementById("remote")
            let localVideoEl = document.getElementById("local")

            remoteVideoEl.addEventListener("click", () => toggleFullscreen(remoteVideoEl));
            localVideoEl.addEventListener("click", () => toggleFullscreen(localVideoEl));

            async function toggleFullscreen(fullEl) {
                try {
                    if (document.fullscreenElement) {
                        await document.exitFullscreen();
                    } else {
                        await fullEl.requestFullscreen();
                        await fullEl.webkitEnterFullscreen();
                    }
                } catch (err) {
                    console.error("Fullscreen failed:", err);
                }
            }

            //     remoteVideo.addEventListener("click", async () => {
            // if (remoteVideo.requestFullscreen) {
            //     await remoteVideo.requestFullscreen();
            // } else if (remoteVideo.webkitEnterFullscreen) {
            //     remoteVideo.webkitEnterFullscreen();
            // }
            // });

            function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        </script>

    </body>

    </html>
