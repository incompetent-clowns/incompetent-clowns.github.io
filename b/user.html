        async function handleGoogleLogin(response) {
            statusEl.value = statusEl.value + `Attempting authentication with Google.\nGoogle sent: ${response.credential}\n`;

            const res = await fetch(`${BACKEND}/auth/google`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ idToken: response.credential })
            });
            log(`Response from the server: ${res}\n`);

            const data = await res.json();

            log(`Obtained the following token\n${data.token}`);

            localStorage.setItem("jwt", data.token);

            log(`Trying a websocket connection now.`);
            connectWebSocket(data.token);
        }

        // Websocket
        function connectWebSocket(token) {
            log(`Websocket connection initiated, using the following token\n${token})`);
            socket = new WebSocket(`${WS_BACKEND}?token=${token}`);

            socket.onmessage = async (event) => {

                log(`\nReceived:\n${event.data}`);
                // if (msg.Wtype === "offer") {
                //     await ensurePeerConnection();
                //     await pc.setRemoteDescription(msg.sdp);
                //     const answer = await pc.createAnswer();
                //     await pc.setLocalDescription(answer);
                //     send({ Wtype: "answer", to: msg.from, sdp: answer });
                // }
                //See if it is JSON
                try {
                    let msg = JSON.parse(event.data);
                    if (msg.type === "answer") {
                        log(`\nSetting Remote Description\n${JSON.stringify(msg.sdp)}`);
                        // await ensurePeerConnection();
                        await pc.setRemoteDescription(msg.sdp);
                        log(`\nDone\n`);
                    }

                    if (msg.type === "ice") {
                        log(`\nAdding Ice Candidate\n${JSON.stringify(msg.candidate)}`);
                        // await ensurePeerConnection();
                        await pc.addIceCandidate(msg.candidate);
                        log(`\nDone\n`);
                    }
                }
                //It is plain text then
                catch {
                    if (event.data == "Authenticated") {
                        showConnected(true);
                    }
                    if (event.data == "Denied") {
                        showConnected(false);
                        localStorage.removeItem("jwt");
                        // google.accounts.id.prompt();
                    }
                }

            };

            socket.onclose = async (event) => {
                showConnected(false);
            }
        }

        document.getElementById("disconnect").onclick = async () => {

                if (localStream) {

                }
                log("Released the local camera.");
                await delay(1000);

                const deviceID = deviceIDEl.value;
                send({ Type: "resetWebRTC", to: deviceID });
                log("Requested the remote client to do the same.");
            }
            catch {

            }

        document.getElementById("connect").onclick = async () => {

            // saveddeviceID = localStorage.getItem("deviceID");

            const deviceID = deviceIDEl.value;

            await ensurePeerConnection();

            delay(1000);

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer)

            log(`Requesting WebRTC reset on the remote device`);
            // send({type: "resetWebRTC", to: deviceID});
            // Doesn't seem to help somehow

            // delay(2000);

            log(`Created an offer.`);
            send({ type: "offer", to: deviceID, sdp: offer });
            log(`Sent an offer to ${deviceID}.`);
        }

        function send(msg) {
            socket.send(JSON.stringify(msg));
        }


        //TODO: replace currentPeer with deviceID 
        function currentPeer() {
            // return document.getElementById("deviceID").value;
            return deviceIDEl.value;
        }

        async function ensurePeerConnection() {
            if (pc) return;

            // localStream = await navigator.mediaDevices.getUserMedia({
            //     video: true,
            //     audio: true
            // });
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                },
                video: true
            });

            document.getElementById("local").srcObject = localStream;

            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" }
                ]
            });

            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

            pc.ontrack = e => {
                document.getElementById("remote").srcObject = e.streams[0];
            };

            pc.onicecandidate = e => {
                if (e.candidate) {
                    send({ type: "ice", to: currentPeer(), candidate: e.candidate });
                }
            };
        }

        function log(str) {
            statusEl.value = statusEl.value + str + "\n";
            statusEl.scrollTop = statusEl.scrollHeight;
            // console.log(str);
        }

    <script>
        let videoEnabled = true;
        let audioEnabled = true;

        muteBtnEl = document.getElementById("muteBtn")
        camBtnEl = document.getElementById("camBtn")

        function toggleVideo() {
            videoEnabled = !videoEnabled;
            localStream.getVideoTracks().forEach(track => {
                track.enabled = videoEnabled;
            });
            if (videoEnabled)
                camBtnEl.textContent = "Camera On";
            else
                camBtnEl.textContent = "Camera Off";
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = audioEnabled;
            });
            if (audioEnabled)
                muteBtn.textContent = "Mic On";
            else
                muteBtn.textContent = "Mic Off";

        }            
    </script>


    <script>
        const directions = ['up', 'down', 'left', 'right'];

        function move(dir, isPressed) {
            console.log(dir, isPressed ? 'pressed' : 'released');

            const ESP32deviceID = ESP32deviceIDEl.value;
            // const messageToESP32 = messageToESP32El.value;
            // const ESP32deviceIDEl
            send({ Type: "cmd", to: ESP32deviceID, payload: { dir, isPressed } });

            // Hook your game logic here, e.g.:
            // if (isPressed) player.startMoving(dir); else player.stopMoving(dir);

        }

        directions.forEach(dir => {
            const btn = document.getElementById(dir);

            const start = (e) => {
                e.preventDefault(); // stops synthetic mouse events + long-press menu
                btn.classList.add('pressed');
                move(dir, true);
            };

            const end = (e) => {
                e.preventDefault();
                btn.classList.remove('pressed');
                move(dir, false);
            };

            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end);
            btn.addEventListener('touchcancel', end);

            // Fallback for desktop/mouse testing
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
        });


        // --- Keyboard bindings ---
        const keyMap = {
            ArrowUp: 'up',
            ArrowDown: 'down',
            ArrowLeft: 'left',
            ArrowRight: 'right',
            // Optional WASD support:
            // w: 'up', a: 'left', s: 'down', d: 'right',
            // W: 'up', A: 'left', S: 'down', D: 'right',
        };

        window.addEventListener('keydown', (e) => {
            const dir = keyMap[e.key];
            if (!dir) return;

            e.preventDefault(); // stop page scrolling on arrow keys

            if (e.repeat) return; // ignore OS auto-repeat, treat as one continuous press

            document.getElementById(dir).classList.add('pressed');
            move(dir, true);
        });

        window.addEventListener('keyup', (e) => {
            const dir = keyMap[e.key];
            if (!dir) return;

            document.getElementById(dir).classList.remove('pressed');
            move(dir, false);
        });


        let remoteVideoEl = document.getElementById("remote")
        let localVideoEl = document.getElementById("local")

        remoteVideoEl.addEventListener("click", () => toggleFullscreen(remoteVideoEl));
        localVideoEl.addEventListener("click", () => toggleFullscreen(localVideoEl));

        async function toggleFullscreen(fullEl) {
            try {
                if (document.fullscreenElement) {
                    await document.exitFullscreen();
                } else {
                    await fullEl.requestFullscreen();
                    await fullEl.webkitEnterFullscreen();
                }
            } catch (err) {
                console.error("Fullscreen failed:", err);
            }
        }

        //     remoteVideo.addEventListener("click", async () => {
        // if (remoteVideo.requestFullscreen) {
        //     await remoteVideo.requestFullscreen();
        // } else if (remoteVideo.webkitEnterFullscreen) {
        //     remoteVideo.webkitEnterFullscreen();
        // }
        // });

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
    </script>
