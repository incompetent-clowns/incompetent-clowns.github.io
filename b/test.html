<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #222;
  }

  .dpad {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 4px;
  }

  .dpad button {
    /* Prevent all the mobile weirdness */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;

    font-size: 20px;
    border: none;
    border-radius: 8px;
    background: #444;
    color: white;
    cursor: pointer;
  }

  .dpad button:active,
  .dpad button.pressed {
    background: #0af;
  }

  #up    { grid-column: 2; grid-row: 1; }
  #left  { grid-column: 1; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
  #down  { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>

<div class="dpad">
  <button id="up">▲</button>
  <button id="left">◀</button>
  <button id="right">▶</button>
  <button id="down">▼</button>
</div>

<script>
  const directions = ['up', 'down', 'left', 'right'];

  function move(dir, isPressed) {
    console.log(dir, isPressed ? 'pressed' : 'released');
    // Hook your game logic here, e.g.:
    // if (isPressed) player.startMoving(dir); else player.stopMoving(dir);
  }

  directions.forEach(dir => {
    const btn = document.getElementById(dir);

    const start = (e) => {
      e.preventDefault(); // stops synthetic mouse events + long-press menu
      btn.classList.add('pressed');
      move(dir, true);
    };

    const end = (e) => {
      e.preventDefault();
      btn.classList.remove('pressed');
      move(dir, false);
    };

    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', end);
    btn.addEventListener('touchcancel', end);

    // Fallback for desktop/mouse testing
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
  });
</script>

</body>
</html>
